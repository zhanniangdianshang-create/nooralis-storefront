  </g>
  <circle cx="1430" cy="230" r="260" fill="#18b8b2" opacity="0.12"/>
  <circle cx="1180" cy="870" r="310" fill="#f0b84f" opacity="0.14"/>
  <circle cx="430" cy="820" r="240" fill="#6f63e8" opacity="0.08"/>
  <g filter="url(#shadow)">
    <rect x="820" y="178" width="690" height="570" rx="8" fill="#ffffff" stroke="#dce5ee" stroke-width="2"/>
    <rect x="860" y="222" width="230" height="318" rx="8" fill="url(#navy)"/>
    <rect x="1128" y="222" width="318" height="86" rx="8" fill="#eef6f8"/>
    <rect x="1128" y="338" width="318" height="86" rx="8" fill="#f8f0ff"/>
    <rect x="1128" y="454" width="318" height="86" rx="8" fill="#fff7e6"/>
    <rect x="860" y="584" width="586" height="92" rx="8" fill="#f7fafc"/>
    <path d="M902 286h142M902 330h106M902 374h164M902 418h124" stroke="#ffffff" stroke-opacity="0.72" stroke-width="12" stroke-linecap="round"/>
    <path d="M1170 265h190M1170 381h170M1170 497h210" stroke="#1b2440" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round"/>
    <path d="M900 640h120M1064 640h170M1280 640h120" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    <path d="M1146 265l22 22 46-56M1146 381l22 22 46-56M1146 497l22 22 46-56" fill="none" stroke="#18b8b2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
