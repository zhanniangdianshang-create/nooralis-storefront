<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Nooralis academy backdrop</title>
  <desc id="desc">Abstract learning backdrop with notebooks, charts, checkmarks, and course cards. No people, faces, logos, creator accounts, or third-party profile references are shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="0.52" stop-color="#eef6f8"/>
      <stop offset="1" stop-color="#f8f0ff"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#29365c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18b8b2"/>
      <stop offset="0.55" stop-color="#f0b84f"/>
      <stop offset="1" stop-color="#e45d44"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#20304d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/>
  <g opacity="0.24">
    <path d="M0 160h1800M0 320h1800M0 480h1800M0 640h1800M0 800h1800M0 960h1800" stroke="#b8c8d8" stroke-width="2"/>
