<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Nooralis abstract course backdrop</title>
  <desc id="desc">Abstract technology backdrop with grid, light trails, and chart-like geometry. It contains no people, faces, logos, account names, or third-party creator references.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="0.55" stop-color="#071019"/>
      <stop offset="1" stop-color="#101019"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22f7ff"/>
      <stop offset="0.55" stop-color="#77ff91"/>
      <stop offset="1" stop-color="#ff355d"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
